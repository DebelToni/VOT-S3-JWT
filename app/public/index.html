<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>File Management with Preview</title>
  <!-- Link to our stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>File Management (MinIO + Keycloak)</h1>
    
    <!-- Login Section -->
    <div id="login-section" class="section">
      <h2>Login</h2>
      <div>
        <label for="username">Username:</label>
        <input type="text" id="username" placeholder="gosho" />
      </div>
      <div>
        <label for="password">Password:</label>
        <input type="password" id="password" placeholder="123" />
      </div>
      <button id="login-btn">Login</button>
      <p id="login-msg" style="color: red;"></p>
    </div>

    <!-- File Management Section -->
    <div id="file-section" class="section hidden">
      <h2>Welcome! Manage your files below.</h2>
      
      <!-- List Files -->
      <button id="list-btn">List Files</button>
      <div id="file-list-container">
        <ul id="file-list"></ul>
      </div>

      <!-- Upload File (text or image) -->
      <h3>Upload File</h3>
      <label for="upload-filename">File Name:</label>
      <input type="text" id="upload-filename" placeholder="example.txt or image.png"/>

      <div>
        <label for="upload-file">Choose File (optional):</label>
        <input type="file" id="upload-file" />
      </div>
      
      <div>
        <label for="upload-file-content">Or Paste Content:</label><br/>
        <textarea id="upload-file-content" placeholder="File content here..." rows="3" cols="50"></textarea>
      </div>
      <button id="upload-btn">Upload</button>

      <!-- Download File -->
      <h3>Download File</h3>
      <label for="download-filename">File Name:</label>
      <input type="text" id="download-filename" placeholder="filename.txt"/>
      <button id="download-btn">Download</button>

      <!-- Update File -->
      <h3>Update File</h3>
      <label for="update-filename">File Name:</label>
      <input type="text" id="update-filename" placeholder="filename.txt"/>
      <label for="update-file-content">New Content:</label><br/>
      <textarea id="update-file-content" placeholder="New file content" rows="3" cols="50"></textarea>
      <button id="update-btn">Update</button>

      <!-- Delete File -->
      <h3>Delete File</h3>
      <label for="delete-filename">File Name:</label>
      <input type="text" id="delete-filename" placeholder="filename.txt"/>
      <button id="delete-btn">Delete</button>

      <p id="operation-msg" style="color: green; margin-top: 10px;"></p>

      <!-- Preview Section -->
      <h3>Preview</h3>
      <div class="preview-area" id="preview-area">
        <em>File preview will appear here</em>
      </div>
    </div>
  </div>

  <script>
    // Keycloak config
    const KEYCLOAK_URL = "http://localhost:8080";
    const REALM = "file-sharing-site";
    const CLIENT_ID = "file-management-client";

    let accessToken = null;

    // DOM elements
    const loginSection = document.getElementById("login-section");
    const fileSection = document.getElementById("file-section");
    const loginMsg = document.getElementById("login-msg");
    const operationMsg = document.getElementById("operation-msg");
    const previewArea = document.getElementById("preview-area");

    // Login elements
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const loginBtn = document.getElementById("login-btn");

    // File list elements
    const listBtn = document.getElementById("list-btn");
    const fileList = document.getElementById("file-list");

    // Upload elements
    const uploadBtn = document.getElementById("upload-btn");
    const uploadFilename = document.getElementById("upload-filename");
    const uploadFileInput = document.getElementById("upload-file");
    const uploadFileContent = document.getElementById("upload-file-content");

    // Download elements
    const downloadBtn = document.getElementById("download-btn");
    const downloadFilename = document.getElementById("download-filename");

    // Update elements
    const updateBtn = document.getElementById("update-btn");
    const updateFilename = document.getElementById("update-filename");
    const updateFileContent = document.getElementById("update-file-content");

    // Delete elements
    const deleteBtn = document.getElementById("delete-btn");
    const deleteFilename = document.getElementById("delete-filename");

    // ------------------------------------------
    // LOGIN - Resource Owner Password Flow
    // ------------------------------------------
    loginBtn.addEventListener("click", async () => {
      const username = usernameInput.value.trim();
      const password = passwordInput.value.trim();

      if (!username || !password) {
        loginMsg.innerText = "Please enter username and password.";
        return;
      }

      loginMsg.innerText = "Logging in...";

      try {
        const tokenUrl = `${KEYCLOAK_URL}/realms/${REALM}/protocol/openid-connect/token`;

        const params = new URLSearchParams();
        params.append("grant_type", "password");
        params.append("client_id", CLIENT_ID);
        // If your client is confidential, you'd also do:
        // params.append("client_secret", "...secret...");
        params.append("username", username);
        params.append("password", password);

        const response = await fetch(tokenUrl, {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded"
          },
          body: params.toString(),
        });

        if (!response.ok) {
          const errorData = await response.json();
          loginMsg.innerText = "Login failed: " + (errorData.error_description || "Unknown error");
          return;
        }

        const data = await response.json();
        accessToken = data.access_token;
        loginMsg.innerText = "Login successful!";
        
        loginSection.classList.add("hidden");
        fileSection.classList.remove("hidden");
      } catch (err) {
        console.error(err);
        loginMsg.innerText = "Error during login.";
      }
    });

    // ------------------------------------------
    // AUTH HEADERS
    // ------------------------------------------
    function getAuthHeaders() {
      return {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + accessToken
      };
    }

    // ------------------------------------------
    // LIST FILES
    // ------------------------------------------
    listBtn.addEventListener("click", async () => {
      operationMsg.innerText = "";
      fileList.innerHTML = "";
      previewArea.innerHTML = "<em>File preview will appear here</em>";

      try {
        const resp = await fetch("/files", {
          method: "GET",
          headers: getAuthHeaders()
        });
        if (!resp.ok) {
          operationMsg.innerText = "Error listing files.";
          return;
        }
        const data = await resp.json();
        // data.files is an array of filenames
        data.files.forEach(fileName => {
          const li = document.createElement("li");
          li.className = "file-item";

          const span = document.createElement("span");
          span.textContent = fileName;

          // PREVIEW button
          const previewButton = document.createElement("button");
          previewButton.textContent = "Preview";
          previewButton.addEventListener("click", () => {
            previewFile(fileName);
          });

          li.appendChild(span);
          li.appendChild(previewButton);
          fileList.appendChild(li);
        });
      } catch (err) {
        console.error(err);
        operationMsg.innerText = "Error listing files.";
      }
    });

    // ------------------------------------------
    // PREVIEW FILE (Text or Image)
    // ------------------------------------------
    async function previewFile(fileName) {
      try {
        // We'll fetch the file as a blob
        const resp = await fetch(`/download/${encodeURIComponent(fileName)}`, {
          headers: {
            "Authorization": "Bearer " + accessToken
          }
        });
        if (!resp.ok) {
          previewArea.textContent = "Unable to preview file.";
          return;
        }
        const blob = await resp.blob();

        // Let's do a quick extension check
        const fileExtension = fileName.split(".").pop().toLowerCase();
        if (["png", "jpg", "jpeg", "gif"].includes(fileExtension)) {
          // It's an image -> show an <img>
          const url = URL.createObjectURL(blob);
          previewArea.innerHTML = "";
          const img = document.createElement("img");
          img.className = "preview-image";
          img.src = url;
          previewArea.appendChild(img);
        } else {
          // Try to read it as text
          const text = await blob.text();
          previewArea.textContent = text;
        }
      } catch (err) {
        console.error(err);
        previewArea.textContent = "Error previewing file.";
      }
    }

    // ------------------------------------------
    // UPLOAD FILE (Text or Image)
    // ------------------------------------------
    uploadBtn.addEventListener("click", async () => {
      const fileName = uploadFilename.value.trim();
      if (!fileName) {
        operationMsg.innerText = "Provide a filename.";
        return;
      }

      operationMsg.innerText = "Uploading...";

      try {
        // Priority: If user selected a file in <input type="file">, use that
        // Otherwise, use the text from the textarea
        let fileDataBase64 = "";

        if (uploadFileInput.files && uploadFileInput.files.length > 0) {
          // We have a file from the file input
          fileDataBase64 = await convertFileToBase64(uploadFileInput.files[0]);
        } else {
          // No file selected, use the textarea content
          const textContent = uploadFileContent.value;
          fileDataBase64 = btoa(textContent); // encode to base64
        }

        const resp = await fetch(`/upload?name=${encodeURIComponent(fileName)}`, {
          method: "POST",
          headers: getAuthHeaders(),
          body: JSON.stringify({ file: fileDataBase64 })
        });
        const data = await resp.json();
        if (!resp.ok) {
          operationMsg.innerText = "Upload failed: " + data.error;
          return;
        }
        operationMsg.innerText = data.message;
      } catch (err) {
        console.error(err);
        operationMsg.innerText = "Error uploading file.";
      }
    });

    // Helper function to read file as base64
    function convertFileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const base64 = reader.result.split(",")[1]; 
          resolve(base64);
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // ------------------------------------------
    // DOWNLOAD FILE
    // ------------------------------------------
    downloadBtn.addEventListener("click", async () => {
      const fileName = downloadFilename.value.trim();
      if (!fileName) {
        operationMsg.innerText = "Specify file name to download.";
        return;
      }

      operationMsg.innerText = "Downloading...";

      try {
        const resp = await fetch(`/download/${encodeURIComponent(fileName)}`, {
          method: "GET",
          headers: {
            "Authorization": "Bearer " + accessToken
          }
        });

        if (!resp.ok) {
          operationMsg.innerText = "File download failed.";
          return;
        }

        const blob = await resp.blob();
        const url = URL.createObjectURL(blob);

        const link = document.createElement("a");
        link.href = url;
        link.download = fileName;
        link.click();

        URL.revokeObjectURL(url);
        operationMsg.innerText = `File '${fileName}' downloaded.`;
      } catch (err) {
        console.error(err);
        operationMsg.innerText = "Error downloading file.";
      }
    });

    // ------------------------------------------
    // UPDATE FILE
    // ------------------------------------------
    updateBtn.addEventListener("click", async () => {
      const fileName = updateFilename.value.trim();
      const newContent = updateFileContent.value;
      if (!fileName || !newContent) {
        operationMsg.innerText = "Specify file name and new content.";
        return;
      }

      try {
        const base64Data = btoa(newContent);
        const resp = await fetch(`/update/${encodeURIComponent(fileName)}`, {
          method: "PUT",
          headers: getAuthHeaders(),
          body: JSON.stringify({ file: base64Data })
        });
        const data = await resp.json();
        if (!resp.ok) {
          operationMsg.innerText = "Update failed: " + data.error;
          return;
        }
        operationMsg.innerText = data.message;
      } catch (err) {
        console.error(err);
        operationMsg.innerText = "Error updating file.";
      }
    });

    // ------------------------------------------
    // DELETE FILE
    // ------------------------------------------
    deleteBtn.addEventListener("click", async () => {
      const fileName = deleteFilename.value.trim();
      if (!fileName) {
        operationMsg.innerText = "Specify file name to delete.";
        return;
      }

      try {
        const resp = await fetch(`/delete/${encodeURIComponent(fileName)}`, {
          method: "DELETE",
          headers: getAuthHeaders()
        });
        const data = await resp.json();
        if (!resp.ok) {
          operationMsg.innerText = "Delete failed: " + data.error;
          return;
        }
        operationMsg.innerText = data.message;
      } catch (err) {
        console.error(err);
        operationMsg.innerText = "Error deleting file.";
      }
    });
  </script>
</body>
</html>
