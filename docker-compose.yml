version: "3.8"

services:
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"   # MinIO S3 API
      - "9001:9001"   # MinIO console
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HTTP_RESPONSE_HEADERS_ALLOW_ORIGIN=*
    # command: ["start-dev", "--import-realm"] 
    command: -start-dev --import-realm
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 5s
      retries: 5
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./config/myrealm-export.json:/opt/keycloak/data/import/myrealm-export.json

  app:
    build: ./app
    container_name: file-management-app
    ports:
      - "3000:3000"  # The Node.js application listens on 3000
    environment:
      # MinIO configuration
      MINIO_ENDPOINT: "minio"
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin"
      MINIO_BUCKET: "pastarma"

      # Keycloak configuration
      KEYCLOAK_URL: "http://keycloak:8080"
      KEYCLOAK_REALM: "file-sharing-site"
      KEYCLOAK_CLIENT_ID: "file-management-client"
      KEYCLOAK_CLIENT_SECRET: "wSDt1DCOPqtDHmLW8PxvYcbGWJhnPYZw"

    depends_on:
      - minio
      - keycloak

volumes:
  minio-data:
  keycloak-data:

